version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: videotogether-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: videotogether_secret_pass
      MYSQL_DATABASE: videotogetherdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvideotogether_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Web Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videotogether-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=jdbc:mysql://db:3306/videotogetherdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=videotogether_secret_pass
      - DDL_AUTO=update
    volumes:
      - video-uploads:/tmp/videotogether_uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
  video-uploads:
