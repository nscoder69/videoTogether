<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VideoTogether</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rose: #e8325a;
            --rose-dark: #b02040;
            --ink: #1a1025;
            --ff-head: 'Playfair Display', Georgia, serif;
            --ff-body: 'DM Sans', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--ff-body);
            background: var(--ink);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(232, 50, 90, .15) 0%, transparent 60%),
                linear-gradient(160deg, #1a1025 0%, #120e1c 100%);
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, .05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            padding-bottom: 20px;
        }
        h1 {
            font-family: var(--ff-head);
            color: var(--rose);
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-family: var(--ff-body);
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, .25);
        }
        .btn-outline:hover {
            border-color: var(--rose);
            color: var(--rose);
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .card {
            background: rgba(0, 0, 0, .2);
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, .8);
        }
        .card p {
            color: rgba(255, 255, 255, .5);
            line-height: 1.6;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-crown"></i> Admin Dashboard</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Home</a>
                <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="card">
                <h3><i class="fas fa-users" style="color: var(--rose)"></i> Total Users</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #fff;" id="totalUsersCount">...</p>
                <p>Registered users</p>
            </div>
            <div class="card">
                <h3><i class="fas fa-video" style="color: var(--rose)"></i> Active Rooms</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #fff;" id="activeRoomsCount">0</p>
                <p>Currently active sessions</p>
            </div>
        </div>

        <div class="card" style="text-align: left; margin-bottom: 40px;">
            <h3 style="margin-bottom: 20px;">Active Rooms</h3>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Room ID</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Host</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Media</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Created</th>
                        </tr>
                    </thead>
                    <tbody id="roomsTableBody">
                        <tr><td colspan="4" style="padding: 20px; text-align: center; color: rgba(255,255,255,0.4);">Loading rooms...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card" style="text-align: left; margin-bottom: 40px;">
            <h3 style="margin-bottom: 20px;">Manage Users</h3>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">User ID</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Username</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Role</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Status</th>
                            <th style="padding: 12px; color: rgba(255,255,255,0.6); font-weight: 500;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" style="padding: 20px; text-align: center; color: rgba(255,255,255,0.4);">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Simple auth check just in case, but Spring Security protects the route
        fetch('/api/auth/me').then(r => {
            if (!r.ok) {
                window.location.href = '/';
            } else {
                return r.json();
            }
        }).then(data => {
            if (data && !data.isAdmin) {
                window.location.href = '/';
            } else {
                loadRooms();
                loadUsersCount();
                loadUsers();
            }
        }).catch(() => window.location.href = '/');

        function loadUsersCount() {
            fetch('/api/auth/users/count')
                .then(r => r.ok ? r.text() : 'Error')
                .then(count => document.getElementById('totalUsersCount').textContent = count)
                .catch(() => document.getElementById('totalUsersCount').textContent = 'Error');
        }

        function loadRooms() {
            fetch('/api/rooms').then(r => r.json()).then(rooms => {
                document.getElementById('activeRoomsCount').textContent = rooms.length;
                const tbody = document.getElementById('roomsTableBody');
                if (rooms.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: rgba(255,255,255,0.4);">No active rooms found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                rooms.forEach(room => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    
                    const date = new Date(room.createdAt).toLocaleString();
                    const mediaIcon = room.mediaSource === 'yt' ? '<i class="fab fa-youtube" style="color:#ff0000"></i> YouTube' : '<i class="fas fa-file-video" style="color:#4ade80"></i> File';
                    
                    tr.innerHTML = `
                        <td style="padding: 16px 12px; font-weight: 500;">#${room.id}</td>
                        <td style="padding: 16px 12px; color: rgba(255,255,255,0.7);">${room.hostUsername || 'Guest'}</td>
                        <td style="padding: 16px 12px;">${mediaIcon}</td>
                        <td style="padding: 16px 12px; color: rgba(255,255,255,0.5); font-size: 0.9rem;">${date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }).catch(() => {
                document.getElementById('roomsTableBody').innerHTML = '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #ef4444;">Failed to load rooms</td></tr>';
            });
        }
        function loadUsers() {
            fetch('/api/auth/users').then(r => r.json()).then(users => {
                const tbody = document.getElementById('usersTableBody');
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center; color: rgba(255,255,255,0.4);">No users found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    
                    const statusText = user.frozen ? '<span style="color:#ef4444">Frozen</span>' : '<span style="color:#4ade80">Active</span>';
                    const actionBtn = user.role === 'ROLE_ADMIN' ? '' : (
                        user.frozen 
                            ? `<button class="btn btn-outline btn-sm" onclick="unfreezeUser(${user.id})" style="padding: 5px 10px; font-size: 0.8rem; border-color: #4ade80; color: #4ade80;">Unfreeze</button>`
                            : `<button class="btn btn-outline btn-sm" onclick="freezeUser(${user.id})" style="padding: 5px 10px; font-size: 0.8rem; border-color: #ef4444; color: #ef4444;">Freeze</button>`
                    );

                    tr.innerHTML = `
                        <td style="padding: 16px 12px; font-weight: 500;">#${user.id}</td>
                        <td style="padding: 16px 12px;">${user.username}</td>
                        <td style="padding: 16px 12px; color: rgba(255,255,255,0.7);">${user.role}</td>
                        <td style="padding: 16px 12px;">${statusText}</td>
                        <td style="padding: 16px 12px;">${actionBtn}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }).catch(() => {
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center; color: #ef4444;">Failed to load users</td></tr>';
            });
        }

        function freezeUser(id) {
            if(confirm('Are you sure you want to freeze this user?')) {
                fetch('/api/auth/users/' + id + '/freeze', { method: 'POST' }).then(() => loadUsers());
            }
        }

        function unfreezeUser(id) {
            if(confirm('Are you sure you want to unfreeze this user?')) {
                fetch('/api/auth/users/' + id + '/unfreeze', { method: 'POST' }).then(() => loadUsers());
            }
        }
        function deleteRoom(id) {
            if(confirm('Are you sure you want to delete this room record?')) {
                fetch('/api/rooms/' + id, { method: 'DELETE' }).then(() => loadRooms());
            }
        }

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' }).then(() => {
                window.location.href = '/';
            });
        }
    </script>
</body>
</html>
