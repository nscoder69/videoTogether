# Server Port
server.port=${PORT:8080}

# Database Configuration (Falls back to embedded H2 if DB_URL is not specified)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/videotogetherdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# File Upload Limits (allow up to 2GB for movies)
spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB

# Disable H2 console in production
spring.h2.console.enabled=false
