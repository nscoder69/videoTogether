# Server Port
server.port=${PORT:8080}

# Database Configuration (MySQL with env var overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/videotogetherdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:videotogether_secret_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File Upload Limits (allow up to 2GB for movies)
spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB

# Disable H2 console in production
spring.h2.console.enabled=false
